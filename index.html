    function newExpenseModal(){

    }    function newServiceModal(service){const s=service||{name:'',category:'غسيل',price:'',cost:0,duration:60,icon:'🚘'};openModal(service?'تعديل الخدمة':'إضافة خدمة جديدة',`<form id="service-form"><input type="hidden" name="id" value="${esc(s.id||'')}"><div class="form-grid"><div class="field"><label>اسم الخدمة *</label><input class="input" name="name" required value="${esc(s.name)}" placeholder="مثال: حماية PPF كاملة"></div><div class="field"><label>الفئة</label><select class="select" name="category">${['غسيل','تلميع','تظليل','حماية','عناية داخلية'].map(x=>`<option ${s.category===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="field"><label>السعر (ر.س) *</label><input class="input" name="price" type="number" required min="0" value="${esc(s.price)}"></div><div class="field"><label>التكلفة المباشرة للوحدة *</label><input class="input" name="cost" type="number" required min="0" step="0.01" value="${esc(s.cost??0)}" placeholder="مواد + عمالة + عمولة"></div><div class="field"><label>المدة التقريبية (دقيقة)</label><input class="input" name="duration" type="number" min="1" value="${esc(s.duration)}"></div><div class="field"><label>أيقونة</label><select class="select" name="icon">${['🚘','🫧','✨','💎','🪄','🛡️','🌤️','🧩','💡','♨️','⚙️','🧽'].map(x=>`<option ${s.icon===x?'selected':''}>${x}</option>`).join('')}</select></div></div><div class="modal-foot" style="margin:18px -20px -18px"><button class="btn btn-primary">حفظ الخدمة</button><button type="button" class="btn btn-quiet" data-action="close-modal">إلغاء</button>${service?`<button type="button" class="btn btn-danger" data-action="delete-service" data-id="${esc(service.id)}">حذف</button>`:''}</div></form>`);document.getElementById('service-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),id=f.get('id');const item={id:id||'sv'+Date.now(),name:f.get('name'),category:f.get('category'),price:Number(f.get('price')),duration:Number(f.get('duration')),icon:f.get('icon'),cost:Number(f.get('cost'))||0};if(id)data.services=data.services.map(x=>x.id===id?item:x);else data.services.push(item);save();closeModal();render();toast('تم حفظ كتالوج الخدمات')})}
    function newCustomerModal(){openModal('إضافة عميل','<form id="customer-form"><div class="form-grid"><div class="field"><label>اسم العميل / الشركة *</label><input class="input" required name="name"></div><div class="field"><label>رقم الجوال</label><input class="input" name="phone" inputmode="tel"></div><div class="field"><label>موافقة التسويق</label><select class="select" name="marketingConsent"><option value="no">غير موافق / غير محدد</option><option value="yes">وافق على العروض</option></select></div><div class="field"><label>الباقة</label><select class="select" name="package"><option>—</option><option>Wonder Wash × 8</option><option>Wonder Plus</option><option>باقة حماية سنوية</option><option>حساب أسطول</option></select></div><div class="field"><label>رصيد نقاط الولاء</label><input class="input" type="number" name="points" value="0"></div></div><div class="modal-foot" style="margin:18px -20px -18px"><button class="btn btn-primary">حفظ العميل</button><button type="button" class="btn btn-quiet" data-action="close-modal">إلغاء</button></div></form>');document.getElementById('customer-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);data.customers.unshift({id:'c'+Date.now(),name:f.get('name'),phone:f.get('phone')||'—',visits:0,points:Number(f.get('points'))||0,lastVisit:new Date().toISOString(),package:f.get('package'),remaining:0,total:0,spend:0,marketingConsent:f.get('marketingConsent')==='yes'});save();closeModal();render();toast('تم تسجيل العميل')})}
    function shiftExpected(){const id=data.shift?.id;return (data.shift?.opening||0)+total(data.sales.filter(s=>s.shiftId===id&&dayKey(s.date)===todayKey()&&s.payment==='cash'),'total')-total(data.expenses.filter(x=>x.shiftId===id&&dayKey(x.date)===todayKey()&&x.payment==='cash'),'amount')}
    function closeShiftModal(){if(!data.shift||data.shift.closed){openShiftModal();return}const expected=shiftExpected();openModal('إقفال صندوق الشفت',`<div class="panel panel-pad" style="background:#fafbfc;margin-bottom:14px"><div class="flex space" style="margin-bottom:8px"><span class="muted">رصيد بداية الشفت</span><b>${sar(data.shift.opening)}</b></div><div class="flex space" style="margin-bottom:8px"><span class="muted">مبيعات نقدية</span><b class="green-text">+ ${sar(total(data.sales.filter(s=>s.shiftId===data.shift.id&&s.payment==='cash'),'total'))}</b></div><div class="flex space" style="margin-bottom:8px"><span class="muted">مصروفات نقدية</span><b class="red-text">− ${sar(total(data.expenses.filter(x=>x.shiftId===data.shift.id&&x.payment==='cash'),'amount'))}</b></div><div class="flex space" style="padding-top:10px;border-top:1px solid var(--line)"><b>المتوقع في الدرج</b><b style="font-size:17px">${sar(expected)}</b></div></div><form id="close-shift-form"><div class="field"><label>النقد الفعلي عند العد *</label><input class="input" type="number" step="0.01" min="0" required name="actual" value="${expected}"></div><div class="field" style="margin-top:10px"><label>ملاحظة (اختياري)</label><input class="input" name="note" placeholder="ملاحظة على العجز أو الزيادة"></div><div class="modal-foot" style="margin:18px -20px -18px"><button class="btn btn-primary">اعتماد إقفال الشفت</button><button type="button" class="btn btn-quiet" data-action="close-modal">رجوع</button></div></form>`);document.getElementById('close-shift-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target),actual=Number(f.get('actual'));data.shift.closed=true;data.shift.closedAt=new Date().toISOString();data.shift.actual=actual;data.shift.variance=actual-expected;data.shift.note=f.get('note');save();closeModal();render();toast(`تم الإقفال · الفرق ${sar(actual-expected)}`)})}
    function openShiftModal(){openModal('بدء شفت جديد','<form id="open-shift-form"><div class="field"><label>رصيد بداية الصندوق *</label><input class="input" name="opening" type="number" min="0" value="300" required></div><div class="field" style="margin-top:10px"><label>اسم الكاشير</label><input class="input" name="cashier" value="مشعل العتيبي"></div><div class="modal-foot" style="margin:18px -20px -18px"><button class="btn btn-primary">بدء الشفت</button><button type="button" class="btn btn-quiet" data-action="close-modal">إلغاء</button></div></form>');document.getElementById('open-shift-form').addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.target);data.shift={id:'sh'+Date.now(),openedAt:new Date().toISOString(),opening:Number(f.get('opening')),closed:false,cashier:f.get('cashier')};save();closeModal();render();toast('الشفت مفتوح، بالتوفيق')})}

pt">طباعة / حفظ PDF</button><button class="btn btn-quiet" data-action="close-modal">إغلاق</button>`);}
    function handleAction(el){const a=el.dataset.action,id=el.dataset.id;
      if(a==='preview-cashier'){activeRole='cashier';page='cashier';cart=[];render();toast('واجهة الكاشير التجريبية مفعلة');return}if(a==='preview-manager'){activeRole='manager';page='dashboard';render();toast('عدت إلى معاينة المدير');return}if(a==='new-order')return newOrderModal();if(a==='new-expense')return newExpenseModal();if(a==='new-service')return newServiceModal();if(a==='edit-service')return newServiceModal(data.services.find(s=>s.id===id));if(a==='new-customer')return newCustomerModal();if(a==='close-shift')return closeShiftModal();if(a==='open-shift')return openShiftModal();if(a==='close-modal')return closeModal();if(a==='print-receipt'){window.print();return}if(a==='delete-service'){data.services=data.services.filter(s=>s.id!==id);save();closeModal();render();toast('تم حذف الخدمة');return}if(a==='next-stage'||a==='deliver'){const o=data.orders.find(x=>x.id===id);if(o){if(a==='deliver'){data.completedOrders=data.completedOrders||[];data.completedOrders.unshift({...o,deliveredAt:new Date().toISOString()});data.orders=data.orders.filter(x=>x.id!==id);save();render();toast('تم تسجيل تسليم السيارة')}else{o.stage=Math.min(4,o.stage+1);save();render();toast(o.stage===4?'السيارة جاهزة للتسليم':'تم تحديث مرحلة السيارة')}}return}
      if(a==='add-cart'){const s=data.services.find(x=>x.id===id);if(s){const mult=cashierVehicle==='SUV'?1.15:cashierVehicle==='كبير'?1.3:1;const price=Math.round(s.price*mult);const found=cart.find(x=>x.id===id&&x.vehicle===cashierVehicle);if(found)found.qty++;else cart.push({id:s.id,name:s.name,price,unitCost:Math.round((Number(s.cost)||0)*mult),qty:1,category:s.category,vehicle:cashierVehicle});render()}return}
      if(a==='remove-cart'){cart.splice(Number(el.dataset.index),1);render();return}if(a==='checkout')return checkout();if(a==='export-sales')return exportCSV('wondercar-sales.csv',data.sales);if(a==='export-sales-report')return exportCSV('wondercar-sales-'+reportRange+'.csv',reportRowsByPeriod(data.sales));if(a==='export-expenses-report')return exportCSV('wondercar-expenses-'+reportRange+'.csv',reportRowsByPeriod(data.expenses));if(a==='export-report')return exportCSV('wondercar-complete-report-'+reportRange+'.csv',fullReportRows());if(a==='export-customers')return exportCSV('wondercar-customers.csv',customerExportRows(false));if(a==='export-marketing'){const rows=customerExportRows(true);if(!rows.length)return toast('لا يوجد عملاء بأرقام صالحة وموافقة مسجلة للتصدير');return exportCSV('wondercar-marketing-consented.csv',rows)}if(a==='export-expenses')return exportCSV('wondercar-expenses.csv',data.expenses);if(a==='export-all')return exportJSON();if(a==='save-settings'){data.business.name=document.getElementById('setting-name').value||data.business.name;data.business.branch=document.getElementById('setting-branch').value||data.business.branch;data.business.vatEnabled=document.getElementById('setting-vat-enabled').checked;data.business.vat=Number(document.getElementById('setting-vat-rate').value)||15;save();render();toast('تم حفظ إعدادات المركز');return}if(a==='reset-demo'){localStorage.removeItem(KEY);data=makeDemo();save();cart=[];page='dashboard';closeModal();render();toast('تم استعادة بيانات العرض');return}if(a==='notifications'){toast('لديك 3 سيارات جاهزة أو قريبة من التسليم');return}
    }
    function checkout(){
      if(!cart.length)return toast('أضف خدمة إلى الفاتورة أولًا');
      if(!data.shift||data.shift.closed){openShiftModal();return}
      const customer=document.getElementById('sale-customer')?.value.trim()||'';
      const phone=normalizePhone(document.getElementById('sale-phone')?.value||'');
      if(!customer){toast('أدخل اسم العميل لإكمال البيع');document.getElementById('sale-customer')?.focus();return}
      if(phone.length<9||phone.length>15){toast('أدخل رقم جوال صحيحًا للعميل');document.getElementById('sale-phone')?.focus();return}
      const plate=document.getElementById('sale-plate')?.value.trim()||'—';
      const tech=document.getElementById('sale-tech')?.value||'';
      const consentChoice=document.getElementById('sale-marketing-consent')?.value||'keep';
      const subtotal=total(cart.map(x=>({v:x.price*x.qty})),'v');
      const tax=data.business.vatEnabled?Math.round(subtotal*data.business.vat/(100+data.business.vat)):0;
      const saleDate=new Date().toISOString();
      let c=data.customers.find(x=>normalizePhone(x.phone)===phone);
      if(!c){c={id:'c'+Date.now(),name:customer,phone,visits:0,points:0,lastVisit:saleDate,package:'—',remaining:0,total:0,spend:0,marketingConsent:consentChoice==='yes'};data.customers.unshift(c)}
      c.name=customer;c.phone=phone;
      if(consentChoice==='yes')c.marketingConsent=true;
      if(consentChoice==='no')c.marketingConsent=false;
      const sale={id:'WC-'+String(2400+data.sales.length+1),date:saleDate,items:cart.map(x=>({...x,unitCost:Number(x.unitCost)||0})),total:subtotal,tax,payment:payMethod,plate,customer,phone,customerId:c.id,marketingConsent:c.marketingConsent===true,tech,branch:data.business.branch,shiftId:data.shift.id,status:payMethod==='corporate'?'آجل':'مدفوع'};
      data.sales.unshift(sale);
      c.visits=(Number(c.visits)||0)+1;c.lastVisit=sale.date;c.spend=(Number(c.spend)||0)+subtotal;c.points=(Number(c.points)||0)+(payMethod==='corporate'?0:Math.floor(subtotal/10));
      if(plate!=='—'&&cart.some(x=>['تظليل','تلميع','حماية','عناية داخلية','غسيل'].includes(x.category))){data.orders.unshift({id:'wo'+data.nextOrder++,plate,model:cart[0].vehicle==='سيدان'?'مركبة سيدان':cart[0].vehicle,customer,phone,services:cart.map(x=>x.name),tech:tech||'يحدد لاحقًا',stage:0,due:'—',created:sale.date,branch:data.business.branch})}
      save();cart=[];render();receiptModal(sale);
    }    function exportCSV(file,rows){if(!rows.length)return toast('لا توجد بيانات للتصدير');const keys=Object.keys(rows[0]);const csv='\ufeff'+[keys.join(','),...rows.map(r=>keys.map(k=>`"${String(typeof r[k]==='object'?JSON.stringify(r[k]):r[k]??'').replaceAll('"','""')}"`).join(','))].join('\r\n');const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([csv],{type:'text/csv;charset=utf-8'}));a.download=file;a.click();URL.revokeObjectURL(a.href);toast('تم تنزيل ملف CSV')}
    function exportJSON(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:'application/json'}));a.download='wondercar-backup.json';a.click();URL.revokeObjectURL(a.href);toast('تم تنزيل نسخة البيانات')}
    window.filterOps=(q)=>{const query=(q||'').toLowerCase();document.querySelectorAll('.car-card').forEach(c=>c.style.display=c.innerText.toLowerCase().includes(query)?'':'none')};
    window.filterCustomers=(q)=>{const input=document.getElementById('customer-search'),segment=document.getElementById('customer-segment')?.value||'all',term=String(q!==undefined?q:(input?.value||'')).toLowerCase();const now=Date.now();const list=data.customers.filter(c=>{const match=(c.name+' '+c.phone+' '+c.package).toLowerCase().includes(term);const age=c.lastVisit?(now-new Date(c.lastVisit).getTime())/86400000:999;const pass=segment==='repeat'?c.visits>=2:segment==='new'?c.visits<=1:segment==='inactive'?age>30:segment==='high'?Number(c.spend)>=3000:segment==='marketing'?c.marketingConsent===true:true;return match&&pass});const body=document.getElementById('customer-rows');if(body)body.innerHTML=customerRows(list)};
    document.addEventListener('click',e=>{if(e.target.classList.contains('modal-backdrop')){closeModal();return}const el=e.target.closest('[data-action]');if(el){e.preventDefault();handleAction(el)}});
    document.addEventListener('click',e=>{const btn=e.target.closest('[data-page]');if(btn){e.preventDefault();if(activeRole==='cashier'&&btn.dataset.page!=='cashier'){toast('هذه الصفحة غير متاحة للكاشير');return}page=btn.dataset.page;render()}});
    render();
  })();
  </script>
